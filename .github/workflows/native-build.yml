name: Build requested iPhone preview

on:
  issues:
    types: [opened, reopened]
  workflow_dispatch:
    inputs:
      channel:
        description: EAS channel for the published preview
        required: true
      update_id:
        description: Exact iOS update ID
        required: true
      runtime_version:
        description: Exact native runtime required by the update
        required: true

permissions:
  contents: read
  issues: read

jobs:
  request:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.event.issue.title, 'Build draft:')
    runs-on: ubuntu-latest
    timeout-minutes: 145
    env:
      DRAFT_PROJECT_ID: e8ecb8b1-95ac-4f76-965a-df4b39ea3929
    steps:
      - name: Check out trusted build tools
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: control
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Validate requester and published preview
        id: request
        env:
          GH_TOKEN: ${{ github.token }}
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          mkdir -p work
          node control/cli/build-request.mjs --project-id "$DRAFT_PROJECT_ID" --output work/request.json
      - name: Check out verified preview source
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.request.outputs.git_commit }}
          path: source
          persist-credentials: false
      - name: Install source dependencies
        run: npm ci
        working-directory: source
      - name: Install app dependencies
        run: npm ci
        working-directory: source/example
      - uses: expo/expo-github-action@v8
        with:
          eas-version: 23.2.0
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Verify native runtime and use trusted EAS workflow
        env:
          EXPECTED_RUNTIME: ${{ steps.request.outputs.runtime }}
          EXPECTED_COMMIT: ${{ steps.request.outputs.git_commit }}
        working-directory: source/example
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT"
          mkdir -p .eas/workflows
          cp ../../control/example/.eas/workflows/build-draft.yml .eas/workflows/build-draft.yml
          npx expo-updates runtimeversion:resolve --platform ios > ../../work/runtime.json
          node ../../control/cli/verify-build-runtime.mjs ../../work/runtime.json "$EXPECTED_RUNTIME"
      - name: Dispatch EAS native build workflow
        working-directory: source/example
        run: node ../../control/cli/dispatch-native-build.mjs ../../work/request.json ../../work/eas-native-workflow.json
      - name: Await and verify the EAS artifact
        run: node control/cli/eas-native-build.mjs wait --request work/request.json --run-file work/eas-native-workflow.json --no-publish --project-directory source/example --output work/ready-build.json
      - uses: actions/upload-artifact@v4
        if: ${{ always() && steps.request.outcome == 'success' }}
        with:
          name: native-build-request
          path: |
            work/request.json
            work/runtime.json
            work/eas-native-workflow.json
            work/ready-build.json
