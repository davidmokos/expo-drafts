name: Publish PR draft

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      channel:
        description: EAS channel for this draft
        default: draft-manual
        required: true
      name:
        description: Name shown in the app
        default: Manual draft
        required: true

permissions:
  contents: read

# Each PR can build in parallel. A later push cancels an obsolete publish for
# that PR. The catalog writer uses Git compare-and-swap retries across PRs.
concurrency:
  group: drafts-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  update:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      DRAFT_CHANNEL: ${{ github.event_name == 'pull_request' && format('draft-pr-{0}', github.event.pull_request.number) || inputs.channel }}
      DRAFT_NAME: ${{ github.event.pull_request.title || inputs.name }}
      DRAFT_PR_NUMBER: ${{ github.event.pull_request.number }}
      DRAFT_PR_URL: ${{ github.event.pull_request.html_url }}
    steps:
      - name: Check Expo authentication
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo 'Add an EXPO_TOKEN repository secret to enable EAS Update publishing.' >&2
            exit 1
          fi
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm ci --prefix example
      - run: npm run build
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Publish update
        working-directory: example
        run: |
          mkdir -p ../work
          eas update --platform ios --channel "$DRAFT_CHANNEL" --message "$DRAFT_NAME" \
            --environment preview --non-interactive --json > ../work/eas-update.json
      - name: Create draft catalog entry
        shell: bash
        run: |
          project_id=$(node -p "require('./example/app.json').expo.extra.eas.projectId")
          args=(--input work/eas-update.json --output work/draft.json --project-id "$project_id" --channel "$DRAFT_CHANNEL" --name "$DRAFT_NAME")
          if [ -n "$DRAFT_PR_NUMBER" ]; then
            args+=(--pr-number "$DRAFT_PR_NUMBER" --pr-url "$DRAFT_PR_URL")
          fi
          if [ -n "$DRAFT_BUILD_URL" ]; then
            args+=(--build-url "$DRAFT_BUILD_URL")
          fi
          node cli/index.mjs catalog "${args[@]}"
        env:
          DRAFT_BUILD_URL: ${{ vars.DRAFT_BUILD_URL }}
      - uses: actions/upload-artifact@v4
        with:
          name: draft-catalog-entry
          path: work/draft.json
          if-no-files-found: error

  catalog:
    needs: update
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Run the catalog writer from the default branch with no PR dependencies.
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          name: draft-catalog-entry
          path: incoming-draft
      - name: Merge and publish catalog
        run: node cli/publish-catalog.mjs --input incoming-draft/draft.json
      - name: Show catalog URL
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "Catalog https://raw.githubusercontent.com/$REPOSITORY/drafts-catalog/catalog.json" >> "$GITHUB_STEP_SUMMARY"
